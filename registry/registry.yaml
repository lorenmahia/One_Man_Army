# One_Man_Army registry: the single source of truth.
# journey/ and departments/ are GENERATED from this file by scripts/build_views.py.
# Edit this file, run `python scripts/build_views.py`, commit both.
version: 1

stages:
  - id: 00-idea
    name: Idea
    purpose: Turn a vague idea into a one-page statement of who it is for, what problem it solves and how it earns money.
    exit_gate: You can state customer, problem, offer and revenue model in four sentences, and name the three riskiest assumptions.
  - id: 01-validate
    name: Validate
    purpose: Test demand, market, pricing and economics with real evidence before spending money.
    exit_gate: Go / adjust / stop decided against criteria written down before the research or interviews started.
  - id: 02-foundation
    name: Foundation
    purpose: Set up the legal entity, banking, tax, data protection, contracts and basic financial controls.
    exit_gate: Entity registered, bank account open, required licences and data registrations filed or scheduled, lawyer and accountant engaged.
  - id: 03-build
    name: Build
    purpose: Build the product on a repeatable engineering pipeline (source control, CI/CD, security, observability) with agents doing the routine work.
    exit_gate: A deployable product with automated tests, a release pipeline and no secrets in the repo.
  - id: 04-launch
    name: Launch
    purpose: Brand, website, SEO/GEO, go-to-market, first customers and first partnerships.
    exit_gate: First paying customers and a measured acquisition channel with known cost per customer.
  - id: 05-raise
    name: Raise
    purpose: Research investors, build the deck and data room, run outreach and manage a fundraising process.
    exit_gate: A funded round closed, or a documented decision to bootstrap instead.
  - id: 06-operate
    name: Operate
    purpose: "Run the company with Fortune-500 cadences: OKRs, dashboards, board reporting, risk register, recurring research."
    exit_gate: Weekly and monthly operating rhythm running without founder heroics; metrics reviewed on a schedule.
  - id: 07-scale
    name: Scale
    purpose: Add markets, hires, partners and systems without breaking what works.
    exit_gate: Repeatable playbooks for hiring, new-market entry and customer onboarding.

domains:
  - id: strategy
    name: Strategy & research
  - id: legal-compliance
    name: Legal & compliance
  - id: finance
    name: Finance
  - id: product-eng
    name: Product, engineering & CI/CD
  - id: agents-automation
    name: Agents & automation
  - id: brand-seo
    name: Brand & SEO
  - id: sales-gtm
    name: Sales & go-to-market
  - id: investor-fundraising
    name: Investors & fundraising
  - id: networking
    name: Networking & partnerships
  - id: operations
    name: Operations

# kind: skill (lives in skills/<id>/) | external (pinned third-party repo) | agent | template | playbook
